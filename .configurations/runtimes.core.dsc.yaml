$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  ########################################
  ### Install Core Runtimes
  ########################################
  ### Install Node.js
  ### -------------------------------------
  - name: Node.js
    type: Microsoft.WinGet/Package
    properties:
      id: OpenJS.NodeJS
      source: winget
      useLatest: true
      acceptAgreements: true
  ### Install Python
  ### -------------------------------------
  - name: Python
    type: Microsoft.WinGet/Package
    properties:
      id: Python.Python.3.14
      source: winget
      useLatest: true
      acceptAgreements: true
