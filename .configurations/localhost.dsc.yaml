# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:
    ########################################
    ### Initialization
    ########################################
     ### Show file extensions and hidden files
     ### -------------------------------------
    - resource: Microsoft.Windows.Developer/WindowsExplorer
      id: Config-FileExplorer
      directives:
        description: Show File Extensions and hidden files
        allowPrerelease: true
      settings:
        FileExtensions: Show
        HiddenFiles: Show
        
    ########################################
    ### Install CLIs, SDKs & Tools
    ########################################
    ### Install Powershell
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Powershell
      directives:
        description: Install Powershell
        allowPrerelease: true
      settings:
        id: Microsoft.PowerShell
    ### Install WindowsTerminal
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: WindowsTerminal
      directives:
        description: Install WindowsTerminal
        allowPrerelease: true
      settings:
        id: Microsoft.WindowsTerminal
    ### Install DSC
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: DSC
      directives:
        description: Install DSC
        allowPrerelease: true
      settings:
        id: Microsoft.DSC
    ### Install Git
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Install Git
        allowPrerelease: true
      settings:
        id: git.git
    ### Git Configure
    ### -------------------------------------
    - resource: PSDscResources/Script
      id: git-config
      dependsOn:
        - git
      directives:
        description: Configure Git to use Default WAM account
      settings:
        SetScript: |
          git config --global user.name "Anthony Cangialosi [MS]"
          git config --global user.email "5457010+acangialosi@users.noreply.github.com"
        GetScript: return $false
        TestScript: return $false
    ### Install NodeJS
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: NodeJS
      directives:
        description: Install NodeJS
        allowPrerelease: true
      settings:
        id: openjs.nodejs
    ### Install Python
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Python
      directives:
        description: Install Python
        allowPrerelease: true
      settings:
        id: Python.Python.3.14
    ### Install DotNet
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: dotnet
      directives:
        description: Install .NET
        allowPrerelease: true
      settings:
        id: microsoft.dotnet.sdk.10
    ### Install Github CLI
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: GithubCLI
      directives:
        description: Install Github CLI
        allowPrerelease: true
      settings:
        id: GitHub.cli
    ### Install Codex
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Codex
      directives:
        description: Install OpenAI Codex
        allowPrerelease: true
      settings:
        id: OpenAI.Codex
    ### Install Claude Code
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Claude
      directives:
        description: Install Anthropic Claude Code
        allowPrerelease: true
      settings:
        id: Anthropic.ClaudeCode
    ### Install Azure CLI
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: AzCLI
      directives:
        description: Install Azure CLI
        allowPrerelease: true
      settings:
        id: Microsoft.AzureCLI 
    ### Install Azd
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Azd
      directives:
        description: Install Azd
        allowPrerelease: true
      settings:
        id: Microsoft.Azd
    ### Install VS Code Insiders
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: VSCode
      directives:
        description: Install VS Code Insiders
        allowPrerelease: true
      settings:
        id: Microsoft.VisualStudioCode.Insiders
    ### Install 1Password App
    ### -------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: 1Password
      directives:
        description: Install 1Password
      settings:
        id: AgileBits.1Password
    ### Install Edge Extension: 1Password
    ### -------------------------------------
    - resource: PSDscResources/Registry
      id: 1password-extension
      directives:
        description: Install 1Password
      settings:
         Key: HKEY_LOCAL_MACHINE\Software\Wow6432Node\Microsoft\Edge\Extensions\dppgmdbiimibapkepcbdbmkaabgiofem
         ValueName: update_url
         ValueData: https://edge.microsoft.com/extensionwebstorebase/v1/crx
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Install ChatGPT
        allowPrerelease: true
      settings:
        id: 9nt1r1c2hh7j
    ########################################
    ### Configure settings
    ########################################
  
