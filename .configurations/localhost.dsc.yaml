# yaml-language-server: $schema=https://aka.ms/dsc/schemas/v3/bundled/config/document.vscode.json
$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
resources:
  ########################################
  ### Initialization
  ########################################
  ### Show file extensions and hidden files
  ### -------------------------------------
  - name: Show File Extensions
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: HideFileExt
      valueData:
        DWord: 0
  - name: Show Hidden Files
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: Hidden
      valueData:
        DWord: 1

  ########################################
  ### Install CLIs, SDKs & Tools
  ########################################
  ### Install 1Password App
  ### -------------------------------------
  - name: 1Password
    type: Microsoft.WinGet/Package
    properties:
      id: AgileBits.1Password
  ### Install Edge Extension: 1Password
  ### -------------------------------------
  - name: 1password extension
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\Software\Wow6432Node\Microsoft\Edge\Extensions\dppgmdbiimibapkepcbdbmkaabgiofem
      valueName: update_url
      valueData:
        String: https://edge.microsoft.com/extensionwebstorebase/v1/crx
  ### Install Powershell
  ### -------------------------------------
  - name: Powershell
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.PowerShell
  ### Install WindowsTerminal
  ### -------------------------------------
  - name: WindowsTerminal
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.WindowsTerminal
  ### Install DSC
  ### -------------------------------------
  - name: DSC
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.DSC
  ### Install Git
  ### -------------------------------------
  - name: git
    type: Microsoft.WinGet/Package
    properties:
      id: git.git
  ### Git Configure
  ### -------------------------------------
  - name: git config
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package', 'git')]"
    properties:
      executable: pwsh
      arguments:
        - -NoProfile
        - -Command
        - git config --global user.name "Anthony Cangialosi [MS]"; git config --global user.email "5457010+acangialosi@users.noreply.github.com"
  ### Install NodeJS
  ### -------------------------------------
  - name: NodeJS
    type: Microsoft.WinGet/Package
    properties:
      id: openjs.nodejs
  ### Install Python
  ### -------------------------------------
  - name: Python
    type: Microsoft.WinGet/Package
    properties:
      id: Python.Python.3.14
  ### Install DotNet
  ### -------------------------------------
  - name: dotnet
    type: Microsoft.WinGet/Package
    properties:
      id: microsoft.dotnet.sdk.10
  ### Install Github CLI
  ### -------------------------------------
  - name: GithubCLI
    type: Microsoft.WinGet/Package
    properties:
      id: GitHub.cli
  ### Install Claude Code
  ### -------------------------------------
  - name: Claude
    type: Microsoft.WinGet/Package
    properties:
      id: Anthropic.ClaudeCode
  ### Install Azure CLI
  ### -------------------------------------
  - name: AzCLI
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.AzureCLI
  ### Install Azd
  ### -------------------------------------
  - name: Azd
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.Azd
  ### Install VS Code Insiders
  ### -------------------------------------
  - name: VSCode
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.VisualStudioCode.Insiders
  ### Install ChatGPT
  ### -------------------------------------
  - name: ChatGPT
    type: Microsoft.WinGet/Package
    properties:
      id: 9nt1r1c2hh7j
  ########################################
  ### Configure settings
  ########################################
