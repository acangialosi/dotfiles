$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  ########################################
  ### Install Runtimes & SDKs
  ########################################
  ### Install DotNet
  ### -------------------------------------
  - name: .NET SDK
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.DotNet.SDK.10
      source: winget
      useLatest: true
      acceptAgreements: true
  ### Install Azd
  ### -------------------------------------
  - name: Azd
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.Azd
      source: winget
      useLatest: true
      acceptAgreements: true
